name: CI

# Continuous-integration gate for the Bordj Steel website.
#
# Runtime: Node 22 LTS. The version is pinned in three places that must stay
# in step — `node-version` in every job below, `.nvmrc`, and `engines.node`
# in `package.json`. Node 20 ("Iron") reached its Node.js end-of-life in
# April 2026 and no longer receives security patches, so it is no longer a
# supported target for this project.
#
# Jobs — four gates plus one advisory:
#   - build     : `next build`            -> required
#   - lint      : `next lint`             -> required
#   - typecheck : `tsc --noEmit`          -> required
#   - test      : `vitest run`            -> required
#   - audit     : `npm audit --omit=dev`  -> advisory (continue-on-error)
#
# `next.config.ts` does not suppress type or lint errors, so `next build`
# itself enforces both. All four gate jobs are safe to mark required in
# branch protection; `audit` must not be, by design.
#
# The `audit` job is deliberately non-blocking. It reports new advisories
# against production dependencies without letting a third-party publication
# fail an unrelated pull request. It exists because nothing in this repo
# surfaced an advisory before, which is how a critical Next.js issue sat
# unnoticed.
#
# Note: `next lint` is deprecated in Next 16. When upgrading, migrate to the
# ESLint CLI (`npx @next/codemod@canary next-lint-to-eslint-cli .`).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Test (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  audit:
    name: Audit (advisory)
    runs-on: ubuntu-latest
    # Advisory only: a newly published advisory should be visible, not a
    # merge blocker. Do not add this job to branch protection.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run audit
