name: CI

# Continuous-integration gate for the Bordj Steel website.
#
# Status (2026-05-29, Node 20): build, lint and typecheck are all GREEN.
#   - build     : PASS (all 31 routes; strict — ignore flags removed)  -> required
#   - lint      : PASS (0 warnings)                                    -> required
#   - typecheck : PASS (0 errors)                                      -> required
#
# `next.config.ts` no longer suppresses type/lint errors, so `next build`
# itself now enforces both. All three jobs are safe to mark required in
# branch protection.
#
# Note: `next lint` is deprecated in Next 16. When upgrading, migrate to the
# ESLint CLI (`npx @next/codemod@canary next-lint-to-eslint-cli .`).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build

  lint:
    name: Lint (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
